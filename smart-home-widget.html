<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom 3D Smart Home Widget</title>
<script>
// ?embed=1: shown inside the wall dashboard, which supplies the toolbar and the light/dark choice
if (new URLSearchParams(location.search).has("embed")){ document.documentElement.classList.add("embed"); document.documentElement.dataset.theme = "light"; }
// inside the Apartment Lights Android app (ApartmentLights project), which adds window.AndroidLamps: the phone
// switches the bulbs itself; the page floats over the home screen with no background or controls
if (window.AndroidLamps) document.documentElement.classList.add("app");
// ?widget=1: the pop-out on the portfolio page. It borrows the Android widget's look — the apartment
// alone on a transparent background, no toolbar — but the bulbs are still the on-screen demo ones.
if (new URLSearchParams(location.search).has("widget")) document.documentElement.classList.add("app", "widget");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecef; --panel:rgba(255,255,255,.9); --text:#1b2a3d; --muted:#5a6878;
  --line:rgba(27,42,61,.14); --navy:#1b2a3d; --btn:#fff; --btn-on:#1b2a3d; --btn-on-text:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151a21; --panel:rgba(30,37,47,.9); --text:#e6ebf1; --muted:#9aa6b5;
    --line:rgba(255,255,255,.12); --navy:#a9c3e6; --btn:#232b36; --btn-on:#a9c3e6; --btn-on-text:#121821;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a21; --panel:rgba(30,37,47,.9); --text:#e6ebf1; --muted:#9aa6b5;
  --line:rgba(255,255,255,.12); --navy:#a9c3e6; --btn:#232b36; --btn-on:#a9c3e6; --btn-on-text:#121821;
  color-scheme:dark;
}
/* embedded in the e-ink dashboard: plain black on white (or white on black), no toolbar of its own */
html.embed{ --bg:#ffffff; --panel:#ffffff; --text:#000000; --muted:#555555; --line:#000000; --navy:#000000; }
html.embed[data-theme="dark"]{ --bg:#000000; --panel:#000000; --text:#ffffff; --muted:#bbbbbb; --line:#ffffff; --navy:#ffffff; }
html.embed .bar{ display:none; }
html.app .bar, html.app .tip, html.app #demo{ display:none; }
html.widget .tip{ display:block; }
html.app body{ background:transparent; }
html.widget, html.widget body{ background:transparent !important; color-scheme:normal !important; }
html.embed .tip, html.embed .dimmer, html.embed .demo{ backdrop-filter:none; -webkit-backdrop-filter:none; border-width:2px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:600; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{position:relative;height:100%}
#app canvas{display:block;touch-action:none}
.bar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.bar .sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line)}   /* divides the button groups */
.bar button{
  font:inherit;font-size:.85rem;font-weight:500;color:var(--text);background:var(--btn);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;
}
.bar button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-text);border-color:transparent}
.bar button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.78rem;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tip b{display:block;font-weight:600}
.tip span{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
.dimmer{position:fixed;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dimmer span{position:relative;width:6px;height:72px;border-radius:3px;background:var(--line);overflow:hidden}
.dimmer i{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:linear-gradient(#ffd58a,#f2a640)}
.dimmer b{font-size:.7rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.note{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;line-height:1.35}
.note b{display:block;font-size:.8rem;font-weight:600;color:var(--navy)}
.note span{display:block;font-size:.72rem;color:var(--muted)}
html.app .note, html.embed .note{ display:none }
.demo{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 32px));box-sizing:border-box;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;gap:8px}
.demo-head{display:flex;align-items:center;gap:8px;font-size:.85rem}
.demo-head b{color:var(--navy)}
.demo-head span{flex:1;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.demo-head button{font:inherit;font-size:.78rem;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
.demo label{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.75rem;color:var(--muted)}
.demo output{justify-self:end;color:var(--text);font-variant-numeric:tabular-nums}
.demo input{grid-column:1 / -1;width:100%;accent-color:#f2a640;margin:0}
</style>
</head>
<body>
<div id="app">
  <div class="tip" id="lampTip" hidden></div>
  <div class="dimmer" id="dimmer" hidden aria-hidden="true"><span><i></i></span><b></b></div>
  <div class="demo" id="demo" hidden role="region" aria-label="Demo mode">
    <div class="demo-head"><b>Demo mode</b><span id="demoSun"></span><button id="demoExit" type="button">Exit</button></div>
    <label>Time <output id="demoTimeOut"></output><input id="demoTime" type="range" min="0" max="1439" step="5"></label>
    <label>Date <output id="demoDateOut"></output><input id="demoDate" type="range" min="1" max="365" step="1"></label>

  <div class="bar" role="toolbar" aria-label="View controls">

    <span class="sep" aria-hidden="true"></span>

    <span class="sep" aria-hidden="true"></span>
    <button id="blab" aria-pressed="false">Room labels</button>

</div>

<script>
(function(){
// ---------- Plan data (feet; x = right, z = down the page) ----------
const WALL_H = 8, CUT_H = 3, T = 0.35, DOOR_H = 6.67;      // 6'8" doors
const CENTER = { x: 25.75, z: 9.65 };
const NOOK_W = 40.1;                    // west wall of the kitchen nook (widened to fit the photographed kitchen)
const EAST = 51.5;                      // exterior east wall
const KW = NOOK_W + T/2;                // interior face of the nook's west wall
const KN = T/2;                         // interior face of the north wall
const EI = EAST - T/2;                  // interior face of the east wall

const walls = [
  // office
  [0,0, 12.2,0], [12.2,0, 12.2,3.6], [12.2,3.6, 14.7,3.6], [14.7,3.6, 14.7,7.3],
  [0,0, 0,19.3], [0,7.3, 11.275,7.3],
  // hallway top (wall ends stop T/2 short of each opening so doors keep full width)
  [14.295,7.3, 23.725,7.3], [26.405,7.3, 34.925,7.3], [37.605,7.3, NOOK_W,7.3],
  // bedroom
  [11.2,10.295, 11.2,19.3], [0,19.3, 11.2,19.3],
  // hallway bottom + living room
  [11.2,12.5, 11.275,12.5], [14.295,12.5, 34,12.5], [34,12.5, 34,19.3], [34,19.3, 51.5,19.3],
  // east wall, split around the two windows
  [51.5,0, 51.5,2.975], [51.5,5.325, 51.5,10.775], [51.5,15.625, 51.5,19.3],
  // kitchen nook
  [NOOK_W,0, 51.5,0], [NOOK_W,0, NOOK_W,7.3],
  // bath 1
  [20.5,0, 29,0], [20.5,0, 20.5,3.4], [20.5,3.4, 23.7,3.4], [23.7,3.4, 23.7,7.3], [29,0, 29,7.3],
  // bath 2
  [32,0, 38.5,0], [32,0, 32,7.3], [38.5,0, 38.5,7.3]
];

// office + bedroom: 2'8" doors; baths: 2'4" doors
const openings = [ [11.45,7.3, 14.12,7.3], [11.2,7.45, 11.2,10.12], [23.9,7.3, 26.23,7.3], [35.1,7.3, 37.43,7.3], [11.45,12.5, 14.12,12.5] ];   // last: entry door, across the hall from the office door
const leaves = [ [13.85,7.12, 13.85,4.45], [11.03,7.72, 8.36,7.72], [24.17,7.12, 24.17,4.79], [37.16,7.12, 37.16,4.79], [11.45,12.5, 14.12,12.5] ];   // last: entry door, shown closed

const rooms = [
  { name:"Office",   wood:true, color:0xe6eaf1, pts:[[0,0],[12.2,0],[12.2,3.6],[14.7,3.6],[14.7,7.3],[0,7.3]], label:[6.2,2.2] },
  { name:"Bedroom",  wood:true, color:0xe6eaf1, pts:[[0,7.3],[11.2,7.3],[11.2,19.3],[0,19.3]], label:[5.6,10.2] },
  { name:"Bath",     color:0xf5e4ac, pts:[[20.5,0],[29,0],[29,7.3],[23.7,7.3],[23.7,3.4],[20.5,3.4]], label:[26.6,6.4] },
  { name:"Bath",     color:0xd8f1e5, pts:[[32,0],[38.5,0],[38.5,7.3],[32,7.3]], label:[35.4,5.7] },
  { name:"Living",   wood:true, color:0xdfe6fa, pts:[[11.2,7.3],[NOOK_W,7.3],[NOOK_W,0],[51.5,0],[51.5,19.3],[34,19.3],[34,12.5],[11.2,12.5]], label:null }
];
const extraLabels = [ ["Hall",22.5,9.9], ["Living",47.6,10.2], ["Kitchen",47.2,5.0] ];

// ---------- Procedural textures ----------
function rng(seed){
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function finishTex(c, anis){
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = anis || 4;
  return t;
}
// honey-oak planks, 5" wide, running along z; one tile = 8 ft
function woodTex(){
  const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
  const x = c.getContext("2d"), r = rng(11), cols = 20, pw = S / cols;
  for (let i = 0; i < cols; i++){
    let y = -r() * S * 0.5;
    while (y < S){
      const len = S * (0.3 + r() * 0.4);
      x.fillStyle = `hsl(${31 + r()*7},${54 + r()*10}%,${54 + r()*9}%)`;
      x.fillRect(i * pw, y, pw, len);
      for (let k = 0; k < 12; k++){
        x.strokeStyle = `rgba(110,68,28,${0.04 + r()*0.07})`;
        x.lineWidth = 1 + r() * 1.5;
        const gx = i * pw + r() * pw;
        x.beginPath(); x.moveTo(gx, y); x.lineTo(gx + (r() - 0.5) * 4, y + len); x.stroke();
      }
      x.fillStyle = "rgba(62,36,14,0.55)"; x.fillRect(i * pw, y, pw, 1.5);
      y += len;
    }
    x.fillStyle = "rgba(62,36,14,0.5)"; x.fillRect(i * pw, 0, 1.6, S);
  }
  const t = finishTex(c, 8);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/8, 1/8);
  return t;
}
// white quartz with gray veining
function marbleTex(){
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const x = c.getContext("2d"), r = rng(5);
  x.fillStyle = "#f3f3f1"; x.fillRect(0, 0, 512, 512);
  x.lineCap = "round"; x.lineJoin = "round";
  for (let i = 0; i < 7; i++){
    const pts = []; let px = r() * 512, py = 0;
    const dx = (r() - 0.5) * 240;
    for (let k = 0; k <= 5; k++){ pts.push([px + (r() - 0.5) * 70, py]); py += 512 / 5; px += dx / 5; }
    x.strokeStyle = `rgba(104,111,120,${0.18 + r() * 0.3})`;
    x.lineWidth = 0.8 + r() * 2.6;
    x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++){
      x.quadraticCurveTo(pts[k-1][0] + (r() - 0.5) * 60, (pts[k-1][1] + pts[k][1]) / 2, pts[k][0], pts[k][1]);
    }
    x.stroke();
  }
  return finishTex(c);
}
// gray linear mosaic backsplash: 12 rows per foot
function tileTex(rx, ry){
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), r = rng(7), rows = 12, rh = 256 / rows;
  x.fillStyle = "#7b8187"; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < rows; i++){
    let px = -r() * 60;
    while (px < 256){
      const len = 50 + r() * 70, g = 150 + Math.floor(r() * 60);
      x.fillStyle = `rgb(${g - 6},${g},${g + 5})`;
      x.fillRect(px + 1, i * rh + 1, len - 2, rh - 2);
      px += len;
    }
  }
  const t = finishTex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
// shaker cabinet door, drawn at 96 px per foot so rails keep a constant 3" width
const doorCache = {};
function doorMat(w, h){
  const key = w.toFixed(2) + "x" + h.toFixed(2);
  if (doorCache[key]) return doorCache[key];
  const s = 96, c = document.createElement("canvas");
  c.width = Math.max(8, Math.round(w * s)); c.height = Math.max(8, Math.round(h * s));
  const x = c.getContext("2d"), m = Math.round(0.24 * s);
  x.fillStyle = "#f8f8f6"; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = "#d3d7dc"; x.lineWidth = 3; x.strokeRect(1.5, 1.5, c.width - 3, c.height - 3);
  x.fillStyle = "#f0f1f1"; x.fillRect(m, m, c.width - 2*m, c.height - 2*m);
  x.strokeStyle = "#cdd1d6"; x.lineWidth = 3; x.strokeRect(m, m, c.width - 2*m, c.height - 2*m);
  x.strokeStyle = "#ffffff"; x.lineWidth = 2; x.strokeRect(m + 3, m + 3, c.width - 2*m - 6, c.height - 2*m - 6);
  return (doorCache[key] = new THREE.MeshStandardMaterial({ map: finishTex(c), roughness: 0.5 }));
}

// ---------- Renderer / scene ----------
const app = document.getElementById("app");
// ?snapshot: a still, transparent top-down picture for the Android widget (see window.snapshot below)
const SNAPSHOT = new URLSearchParams(location.search).has("snapshot");
const APP = !!window.AndroidLamps;   // inside the Android app (see the top of the page)
const WIDGET = document.documentElement.classList.contains("widget");   // the portfolio pop-out (see the top of the page)
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:SNAPSHOT || APP || WIDGET, preserveDrawingBuffer:SNAPSHOT });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // the scene is static, so shadows re-render only when walls move
renderer.shadowMap.needsUpdate = true;
// Draw only when something changed (camera, lamps, walls, sun, theme, size): an always-on wall
// display (e-ink tablet) then idles instead of re-rendering an identical frame 60 times a second.
let dirty = true;
const invalidate = () => { dirty = true; };
renderer.outputEncoding = THREE.sRGBEncoding;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8;
controls.maxDistance = 160;

// ambient + sun kept low so the lamps carry much of the light; inside the e-ink dashboard (?embed) the base
// light is raised, since an e-ink screen shows the darker look as murky grey
const EMBEDDED = document.documentElement.classList.contains("embed");
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a94a3, EMBEDDED ? 0.5 : 0.27);
scene.add(hemi);
// faint shadowless fill from one fixed side, so walls facing different ways get slightly different
// tones indoors (hemisphere light alone shades every vertical wall the same flat grey)
const fill = new THREE.DirectionalLight(0xffffff, EMBEDDED ? 0.22 : 0.12);
fill.position.set(-0.45, 1, 0.75); scene.add(fill);
// Sun: real position for the apartment (33-17 36th Ave, Astoria) at the viewer's current time.
// The model's +x wall (the windows) faces the street, which from the north side of 36th Ave is SSW.
const SITE = { lat:40.7557, lon:-73.9274, windowsFace:209.5 };   // windowsFace: compass bearing of model +x
const sun = new THREE.DirectionalLight(0xfff2dc, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-34, right:34, top:34, bottom:-34, near:1, far:220 });
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02;
scene.add(sun);
function sunAngles(date){   // solar azimuth (degrees clockwise from north) and elevation, NOAA-style approximation
  const rad = Math.PI/180, d = date / 86400000 - 10957.5;   // days since J2000
  const g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2*g)) * rad, e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const H = ((18.697374558 + 24.06570982441908 * d) * 15 + SITE.lon) * rad - ra, lat = SITE.lat * rad;
  const el = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.cos(dec) * Math.sin(H), Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.cos(H) * Math.sin(lat));
  return { az: (az / rad + 360) % 360, el: el / rad };
}
const sunLow = new THREE.Color(0xffa860), sunHigh = new THREE.Color(0xfff2dc);
let demoTime = null;   // a Date while demo mode overrides the clock, else null (live sun)
if (SNAPSHOT){ demoTime = new Date(); demoTime.setHours(13, 0, 0, 0); }   // same midday light in every snapshot
else { demoTime = new Date(); demoTime.setHours(20, 15, 0, 0); }          // the demo opens in the evening, where the lamps do the work
function updateSun(){
  const { az, el } = sunAngles(demoTime || new Date()), rad = Math.PI/180;
  const b = (az - SITE.windowsFace) * rad, flat = Math.cos(el * rad);   // bearing relative to the model's +x
  sun.position.set(Math.cos(b) * flat * 100, Math.sin(el * rad) * 100, Math.sin(b) * flat * 100);
  sun.intensity = 1.6 * THREE.MathUtils.smoothstep(el, -1, 8);          // fades out through sunset
  sun.color.copy(sunLow).lerp(sunHigh, THREE.MathUtils.smoothstep(el, 2, 30));   // warmer near the horizon
  renderer.shadowMap.needsUpdate = true;
}
updateSun(); setInterval(updateSun, 60000);

const world = new THREE.Group();
world.position.set(-CENTER.x, 0, -CENTER.z);
scene.add(world);

// ground
// unlit, so outdoors shows neither sunlight nor the building's shadow: the sun is only seen through the windows
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color:0xffffff }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02;
scene.add(ground);

// ---------- Materials ----------
const M = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:0.8 }, o));
const mat = {
  wall: M(0xeee6d2, { roughness:0.95 }),               // cream paint, as in the photos
  cap: M(0x1b2a3d, { roughness:0.6 }),

// Invisible full-height copies of the walls, window walls, doors and lintels, plus a roof over every

function cushion(w, h, d, r=0.12, m=mat.black){

  sh.moveTo(-x, -h/2); sh.lineTo(x, -h/2); sh.quadraticCurveTo(w/2, -h/2, w/2, -y);
  sh.lineTo(w/2, y); sh.quadraticCurveTo(w/2, h/2, x, h/2); sh.lineTo(-x, h/2);
  sh.quadraticCurveTo(-w/2, h/2, -w/2, y); sh.lineTo(-w/2, -y); sh.quadraticCurveTo(-w/2, -h/2, -x, -h/2);
  const bev = Math.min(0.06, d/3);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: d - 2*bev, bevelEnabled:true, bevelSize:bev, bevelThickness:bev, bevelSegments:3, curveSegments:6 });
  geo.center();
  const mesh = new THREE.Mesh(geo, m); mesh.castShadow = true;
  return mesh;
}

function cabDoor(parent, w, h, x, yc, z, pullY, side){

  m.position.set(x, yc, z); m.receiveShadow = true; parent.add(m);

// vertical prism from a plan-view polygon [[x, z], ...]
function prism(pts, h, m, y0, parent){
  const s = new THREE.Shape();
  pts.forEach(([x, z], i) => i ? s.lineTo(x, -z) : s.moveTo(x, -z));
  const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth:h, bevelEnabled:false }), m);
  mesh.rotation.x = -Math.PI/2; mesh.position.y = y0;
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

    shader.vertexShader = "varying vec3 vLampWorld;\n" + shader.vertexShader.replace("#include <project_vertex>",
      "#include <project_vertex>\nvLampWorld = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;");
    let chunk = THREE.ShaderChunk.lights_fragment_begin;
    if (ignoreSun) chunk = chunk.replace(
      /(#if \( NUM_DIR_LIGHTS > 0 \) && defined\( RE_Direct \)[\s\S]*?)RE_Direct\( directLight, geometry, material, reflectedLight \);/,
      "$1if ( UNROLLED_LOOP_INDEX >= NUM_DIR_LIGHT_SHADOWS ) RE_Direct( directLight, geometry, material, reflectedLight );");
    // A lamp that's off, or a point outside its room, skips the lamp entirely, shadow lookups included (the
    // costly part: every lamp casts shadows). The skip is the same across whole rooms, so the GPU takes it
    // cheaply; without it a zoomed-in view, all lit floor, ran every lamp's shadow on every pixel.
    chunk = chunk.replace(
      /(#if \( NUM_POINT_LIGHTS > 0 \) && defined\( RE_Direct \)[\s\S]*?)(getPointDirectLightIrradiance\( pointLight, geometry, directLight \);[\s\S]*?RE_Direct\( directLight, geometry, material, reflectedLight \);)/,
      // UNROLLED_LOOP_INDEX: three.js copies the loop out once per light and only rewrites "[ i ]" and this name
      "$1if ( any( greaterThan( pointLight.color, vec3( 0.0 ) ) ) && ( inLampRoom( uLampBox[ UNROLLED_LOOP_INDEX * 3 ], vLampWorld.xz ) || inLampRoom( uLampBox[ UNROLLED_LOOP_INDEX * 3 + 1 ], vLampWorld.xz ) || inLampRoom( uLampBox[ UNROLLED_LOOP_INDEX * 3 + 2 ], vLampWorld.xz ) ) ) {\n$2\n}");
    shader.fragmentShader = `varying vec3 vLampWorld;
#if NUM_POINT_LIGHTS > 0
uniform vec4 uLampBox[ NUM_POINT_LIGHTS * 3 ];
#endif
bool inLampRoom( vec4 b, vec2 p ) { return p.x >= b.x && p.x <= b.y && p.y >= b.z && p.y <= b.w; }
` + shader.fragmentShader.replace("#include <lights_fragment_begin>", chunk);
  };
  m.customProgramCacheKey = () => ignoreSun ? "lit-rooms-nosun" : "lit-rooms";
}
scene.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(patchLighting); });

// ---------- Resize / loop ----------
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// The dashboard loads this page in the background while its tab is hidden (zero size); the first real size
// re-fits the current view, since each view's framing depends on the screen's shape.
let sized = false;
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!sized){ sized = true; goTo(Object.keys(viewBtns).find(k => viewBtns[k].getAttribute("aria-pressed") === "true") || "cutaway", true); }
  invalidate();
}
window.addEventListener("resize", resize);
// In the portfolio pop-out the page is an iframe the host resizes as it places it, which a window
// resize event doesn't always follow, so watch the element itself.
if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
resize(); setView(APP ? "top" : "cutaway", true);   // the page opens on the cutaway view (the app: top view)

// In the app: dragging turns the model only if the app's setting allows it (a press on a lamp never does,
// see the capture-phase pointerdown above); a tap on empty space, off the apartment, closes the overlay.
if (APP){
  controls.enabled = !!window.AndroidLamps.rotate();
  controls.enablePan = false;
  let down = null;
  renderer.domElement.addEventListener("pointerdown", e => { down = { x:e.clientX, y:e.clientY }; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) return;
    if (!hitAt(e) && !lampAt(e)) window.AndroidLamps.close();
  });
}

// window.snapshot(w, h): renders the top view at w x h on a transparent background and returns the PNG plus
// where each smart lamp's tap target lands, as fractions of the picture ({alias: [x, y, radius]})
if (SNAPSHOT) window.snapshot = (w, h) => {
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  setView("top", true); applyWallHeight(wallH);
  renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera);
  const spots = {};
  Object.entries(smartLamps).forEach(([alias, L]) => {
    const hit = L.meshes[0], p = hit.getWorldPosition(new THREE.Vector3()), q = p.clone().project(camera);
    const edge = p.clone().add(new THREE.Vector3((hit.geometry.parameters || {}).radius || 1, 0, 0)).project(camera);
    spots[alias] = [(q.x + 1) / 2, (1 - q.y) / 2, Math.abs(edge.x - q.x) / 2];
  });
  return { png: renderer.domElement.toDataURL("image/png"), spots };
};

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
let last = performance.now(), lastMove = -1e9;
const FULL_RATIO = Math.min(window.devicePixelRatio, 2), MOVING_RATIO = Math.max(1, FULL_RATIO * 0.6);
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (camTween){
    camTween.t = reduce ? 1 : Math.min(1, camTween.t + dt / 0.9);
    const k = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    controls.target.lerpVectors(camTween.t0, camTween.t1, k);
    if (camTween.t >= 1) camTween = null;
  }
  if (Math.abs(wallH - wallTarget) > 0.01){
    wallH += (wallTarget - wallH) * (reduce ? 1 : Math.min(1, dt * 7));
    applyWallHeight(wallH);
  }
  if (updateLamps(dt)) dirty = true;
  const moving = controls.update() || !!camTween;   // update() reports camera movement, including damping
  if (moving) dirty = true;
  if (renderer.shadowMap.needsUpdate) dirty = true;   // walls moved or the sun changed
  if (APP){   // phones: fewer pixels while the camera moves (pinch, turn), full sharpness once it settles
    if (moving) lastMove = now;
    const ratio = now - lastMove < 200 ? MOVING_RATIO : FULL_RATIO;
    if (ratio !== renderer.getPixelRatio()){ renderer.setPixelRatio(ratio); dirty = true; }
  }
  if (dirty){ renderer.render(scene, camera); dirty = false; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
