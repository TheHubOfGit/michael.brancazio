<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Michael Brancazio | Full-Stack Data Professional</title>
  <meta name="description" content="Explore Michael Brancazio's work in data engineering, AI implementation, healthcare analytics, and full-stack development.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="images/favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #4ade80; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(17px, 4.5vw, 28px); font-weight: 400; line-height: 1.6; overflow-wrap: anywhere; }
    .cursor { display: inline-block; width: 0.6em; height: 1em; margin-left: 3px; background: currentColor; vertical-align: -0.1em; animation: blink 1s step-end infinite; }
    .intro-description { margin: 0; color: #b2bcb5; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
    .enter-link { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #4ade80; border-radius: 8px; padding: 12px 22px; color: #4ade80; font: inherit; text-decoration: none; }
    .enter-link:hover { background: #102919; }
    .enter-link:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .hint { color: #b2bcb5; font-size: 13px; margin: 0; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="Michael Brancazio's portfolio"><span id="command" aria-hidden="true">print(Michael Brancazio)</span><span class="cursor" aria-hidden="true"></span></h1>
    <p class="intro-description">Data engineering. AI implementation. Full-stack development.</p>
    <a class="enter-link" id="enter-portfolio" href="main.html">Explore portfolio →</a>
    <p class="hint">Press Enter or select Explore portfolio</p>
  </main>
  <script>
    const link = document.getElementById('enter-portfolio');
    // Preserve shared visibility preferences and section deep links through the intro.
    link.href = `main.html${location.search}${location.hash}`;
    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing && !event.altKey && !event.ctrlKey && !event.metaKey) {
        event.preventDefault();
        link.click();
      }
    });
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const command = document.getElementById('command');
      const text = command.textContent;
      let position = 0;
      command.textContent = '';
      const timer = setInterval(() => {
        command.textContent = text.slice(0, ++position);
        if (position >= text.length) clearInterval(timer);
      }, 65);
      addEventListener('pagehide', () => clearInterval(timer), { once: true });
    }
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H0X2CVQQE5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-H0X2CVQQE5');
  </script>
</body>
</html>
