    /* Employer & project detail */
    .i-detailhead { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4px 24px 22px; }
    .i-detailhead .i-logo, .i-detailhead .i-gl { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 12px; }
    .i-detailhead .i-gl .ico { width: 42px; height: 42px; }
    .i-detailhead h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.2; }
    .i-detailhead p { font-size: 15px; color: var(--i-label-2); margin-top: 4px; }
    .i-rolehead { padding: 4px 36px 8px; }
    .i-rolehead b { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; }
    .i-rolehead span { font-size: 14px; color: var(--i-label-2); }
    .i-proj { margin: 0 16px 12px; padding: 16px; border-radius: var(--i-radius); background: var(--i-cell); width: calc(100% - 32px); text-align: left; display: flex; flex-direction: column; gap: 8px; color: var(--i-label); }
    .i-proj__top { display: flex; align-items: center; gap: 12px; }
    .i-proj__t { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
    .i-proj__s { font-size: 13px; color: var(--i-label-2); }
    .i-proj__d { font-size: 15px; line-height: 1.4; color: var(--i-label-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .i-impact { display: flex; gap: 8px; align-items: flex-start; }
    .i-impact .ico { width: 18px; height: 18px; color: var(--i-green); margin-top: 1px; flex-shrink: 0; stroke-width: 2; }

    /* Floating tab bar (iOS 26) */
    .i-tabbar {
      position: absolute; z-index: 30; left: 0; right: 0; bottom: calc(var(--i-bottom) - 8px); display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px;
      pointer-events: none; transition: transform 0.35s var(--i-spring);
    }
    .i-tabbar > * { pointer-events: auto; }
    .i-tabs { position: relative; display: flex; padding: 4px; border-radius: 32px; flex: 1; max-width: 360px; transition: max-width 0.4s var(--i-spring); }
    .i-tab { position: relative; z-index: 1; flex: 1; min-width: 0; height: 56px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--i-label); letter-spacing: 0; }
    .i-tab .ico { width: 24px; height: 24px; stroke-width: 1.7; }
    .i-tab.is-on { color: var(--i-accent); }
    .i-tab.is-on .ico { stroke-width: 2; }
    .i-tabs__lens { position: absolute; z-index: 0; top: 4px; bottom: 4px; border-radius: 28px; background: var(--i-fill); transition: left 0.45s var(--i-spring), width 0.45s var(--i-spring); }
    .i-tabsearch { width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center; color: var(--i-label); flex-shrink: 0; }
    .i-tabsearch .ico { width: 24px; height: 24px; stroke-width: 1.9; }
    .i-tabsearch.is-on { color: var(--i-accent); }
    /* Minimized while scrolling down, like iOS 26 */
    .i-tabbar.is-min .i-tabs { max-width: 64px; flex: 0 0 auto; }
    .i-tabbar.is-min .i-tab:not(.is-on) { display: none; }
    .i-tabbar.is-min .i-tab span { display: none; }
    .i-tabbar.is-min .i-tab { width: 56px; flex: none; }
    .i-tabbar.is-min .i-tabs__lens { opacity: 0; }
    .i-tabbar.is-min { justify-content: space-between; }

    /* Search (in-app) */
    .i-searchbar { position: absolute; z-index: 30; left: 16px; right: 16px; bottom: calc(var(--i-bottom) - 2px); display: flex; gap: 10px; align-items: center; }
    .i-searchfield { flex: 1; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .i-searchfield .ico { width: 19px; height: 19px; color: var(--i-label-2); }
    .i-searchfield input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 17px; color: var(--i-label); }
    .i-searchfield input::placeholder { color: var(--i-label-2); }
    .i-searchfield input::-webkit-search-cancel-button { -webkit-appearance: none; }
    .i-suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 20px; }
    .i-suggest button { font-size: 15px; font-weight: 500; padding: 8px 14px; border-radius: 999px; background: var(--i-cell); color: var(--i-accent); }
    #ios mark.hit { background: color-mix(in srgb, #ffd60a 55%, transparent); color: inherit; border-radius: 3px; }

    /* Messages */
    .i-msghead { position: absolute; z-index: 10; top: 0; left: 0; right: 0; padding: var(--i-top) 16px 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
    .i-msghead::before {
      content: ""; position: absolute; inset: 0 0 -20px; z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--i-bg) 92%, transparent) 50%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent);
    }
    .i-msgwho { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--i-label); }
    .i-msgwho img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
    .i-msgwho span { display: inline-flex; align-items: center; gap: 2px; padding: 3px 9px; border-radius: 12px; }
    .i-msgwho .ico { width: 11px; height: 11px; stroke-width: 2.4; color: var(--i-label-2); }
    #ios .msg-thread { position: absolute; inset: 0; padding: calc(var(--i-top) + 100px) 14px calc(var(--i-bottom) + 118px); background: var(--i-bg); gap: 2px; overflow-y: auto; }
    :root:not([data-theme="dark"]) #ios .msg-thread { background: #fff; }
    #ios .bubble { font-size: 17px; line-height: 1.3; padding: 8px 14px 9px; border-radius: 20px; max-width: 76%; }
    #ios .bubble--out { background: var(--i-accent); }
    #ios .bubble--in { background: color-mix(in srgb, var(--i-fill-2) 100%, var(--i-cell)); color: var(--i-label); }
    :root:not([data-theme="dark"]) #ios .bubble--in { background: #e9e9eb; }
    #ios .bubble--tail.bubble--out { border-bottom-right-radius: 6px; }
    #ios .bubble--tail.bubble--in { border-bottom-left-radius: 6px; }
    #ios .msg-stamp { font-size: 12px; color: var(--i-label-2); }
    #ios .msg-status { font-size: 12px; color: var(--i-label-2); }
    #ios .typing { background: #e9e9eb; padding: 13px 15px; }
    :root[data-theme="dark"] #ios .typing { background: var(--i-fill-2); }
    .i-composer { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; padding: 6px 12px calc(var(--i-bottom) + 4px); }
    .i-composer::before {
      content: ""; position: absolute; inset: -24px 0 0; z-index: -1;
      background: linear-gradient(0deg, color-mix(in srgb, var(--i-bg) 92%, transparent) 55%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      -webkit-mask-image: linear-gradient(0deg, #000 60%, transparent); mask-image: linear-gradient(0deg, #000 60%, transparent);
    }
    :root:not([data-theme="dark"]) .i-composer::before { background: linear-gradient(0deg, rgba(255,255,255,.92) 55%, transparent); }
    #ios .msg-chips { padding: 0 2px 8px; }
    :root[data-theme="dark"] .i-live { color: var(--i-green); }
    #ios .msg-chip { font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 999px; box-shadow: none; background: var(--i-fill); color: var(--i-accent); }
    .i-composer__row { display: flex; align-items: flex-end; gap: 8px; }
    .i-composer__plus { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--i-label); flex-shrink: 0; }
    .i-composer__plus .ico { width: 20px; height: 20px; stroke-width: 2; }
    .i-composer__field { flex: 1; min-height: 40px; border-radius: 20px; display: flex; align-items: flex-end; padding: 3px 3px 3px 14px; }
    .i-composer__field textarea { flex: 1; border: none; background: transparent; resize: none; font-size: 17px; line-height: 1.3; padding: 6px 0; max-height: 120px; color: var(--i-label); }
    .i-composer__field textarea::placeholder { color: var(--i-label-2); }
    .i-send { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; background: var(--i-accent); color: #fff; transition: transform 0.25s var(--i-spring), opacity 0.2s; flex-shrink: 0; }
    .i-send .ico { width: 17px; height: 17px; stroke-width: 2.4; }
    .i-send[disabled] { display: none; }

    /* Résumé viewer */
    .i-doc { position: absolute; inset: 0; overflow: auto; background: #d6d6db; padding: calc(var(--i-top) + 60px) 12px calc(var(--i-bottom) + 90px); }
    :root[data-theme="dark"] .i-doc { background: #111113; }
    .i-docpage { width: 8.5in; background: #fff; color: #1d1d1f; transform-origin: 0 0; box-shadow: 0 2px 14px rgba(0,0,0,.18); border-radius: 4px; user-select: text; -webkit-user-select: text; }
    .i-doctools { position: absolute; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(var(--i-bottom) - 2px); display: flex; gap: 4px; padding: 4px; border-radius: 30px; }
    .i-doctools .i-capsule { height: 48px; font-size: 16px; white-space: nowrap; }

    /* Settings */
    .i-switch { width: 64px; height: 28px; border-radius: 14px; background: var(--i-fill-2); position: relative; flex-shrink: 0; transition: background 0.25s; }
    .i-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform 0.3s var(--i-spring); }
    .i-switch.is-on { background: var(--i-green); }
    .i-switch.is-on::after { transform: translateX(22px); }
    .i-seg { display: flex; background: var(--i-fill); border-radius: 18px; padding: 3px; margin: 12px 16px; }
    .i-seg button { flex: 1; height: 32px; border-radius: 15px; font-size: 14px; font-weight: 600; color: var(--i-label); }
    .i-seg button.is-on { background: var(--i-cell); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); }
    :root[data-theme="dark"] .i-seg button.is-on { background: #636366; }
    .i-walls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px 16px 16px; }
    .i-wallpick { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 13px; color: var(--i-label-2); }
    .i-wallpick .i-wall { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; box-shadow: 0 0 0 0.5px rgba(0,0,0,.12); transform: none !important; filter: none !important; }
    .i-wallpick.is-on .i-wall { box-shadow: 0 0 0 3px var(--i-accent); }
    .i-wallpick.is-on { color: var(--i-accent); font-weight: 600; }

    /* Overlays: folder, context menu, share sheet, banner */
    .i-scrim { position: absolute; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.18); opacity: 0; transition: opacity 0.3s; }
    .i-scrim.is-on { opacity: 1; }
    .i-folderview { position: absolute; z-index: 61; left: 50%; top: 50%; width: min(330px, calc(100% - 48px)); transform: translate(-50%, -50%) scale(0.6); opacity: 0; transition: transform 0.45s var(--i-spring), opacity 0.25s; }
    .i-folderview.is-on { transform: translate(-50%, -50%); opacity: 1; }
    .i-folderview h3 { font-size: 30px; font-weight: 700; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.25); padding: 0 8px 16px; letter-spacing: -0.03em; }
    .i-folderview__panel { border-radius: 38px; padding: 22px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 8px; background: rgba(255,255,255,.28); }
    :root[data-theme="dark"] .i-folderview__panel { background: rgba(60,60,64,.4); }
    .i-ctx-icon { position: absolute; z-index: 62; pointer-events: none; transition: transform 0.35s var(--i-spring); }
    .i-ctx { position: absolute; z-index: 63; width: 250px; border-radius: 22px; overflow: hidden; transform-origin: top left; animation: i-pop 0.35s var(--i-spring); background: var(--i-glass-strong); }
    @keyframes i-pop { from { transform: scale(0.6); opacity: 0; } }
    .i-ctx button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 18px; font-size: 17px; color: var(--i-label); text-align: left; }
    .i-ctx button + button { border-top: 0.5px solid var(--i-sep); }
    .i-ctx button:active { background: var(--i-fill); }
    .i-ctx .ico { width: 20px; height: 20px; }
    .i-sheet {
      position: absolute; z-index: 70; left: 8px; right: 8px; bottom: 8px; border-radius: 36px; padding: 8px 0 calc(var(--i-bottom) - 10px);
      background: var(--i-glass-strong); transform: translateY(110%); transition: transform 0.45s var(--i-spring); touch-action: none;
    }
    .i-sheet.is-on { transform: none; }
    .i-sheet__grab { width: 38px; height: 5px; border-radius: 3px; background: var(--i-label-3); margin: 0 auto 10px; }
    .i-sheet__head { display: flex; align-items: center; gap: 12px; padding: 4px 20px 16px; }
    .i-sheet__head img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
    .i-sheet__head b { display: block; font-size: 16px; font-weight: 600; }
    .i-sheet__head small { display: block; font-size: 13px; color: var(--i-label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58vw; }
    .i-sheet__apps { display: flex; gap: 16px; padding: 4px 20px 18px; overflow-x: auto; scrollbar-width: none; border-top: 0.5px solid var(--i-sep); border-bottom: 0.5px solid var(--i-sep); padding-top: 16px; }
    .i-sheet__apps button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--i-label); flex-shrink: 0; width: 64px; }
    .i-sheet__apps .i-ico { width: 60px; height: 60px; border-radius: 15px; }
    .i-sheet__apps .i-ico .ico { width: 30px; height: 30px; }
    .i-sheet .i-list { margin: 14px 16px 10px; }
    .i-banner {
      position: absolute; z-index: 80; left: 10px; right: 10px; top: calc(var(--i-top) + 4px); border-radius: 26px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left;
      background: var(--i-glass-strong); color: var(--i-label); transform: translateY(calc(-100% - var(--i-top) - 20px)); transition: transform 0.55s var(--i-spring); touch-action: none;
    }
    .i-banner.is-on { transform: none; }
    .i-banner .i-ico { width: 40px; height: 40px; border-radius: 10px; }
    .i-banner .i-ico .ico { width: 22px; height: 22px; }
    .i-banner b { font-size: 15px; font-weight: 600; }
    .i-banner p { font-size: 15px; line-height: 1.3; }
    .i-banner time { font-size: 13px; color: var(--i-label-2); margin-left: auto; align-self: flex-start; }
    body.is-ios .hud { bottom: auto; top: calc(var(--i-top, 54px) + 10px); border-radius: 999px; padding: 11px 18px; font-size: 15px; font-weight: 600; }
    @media print { #ios { display: none !important; } }
  </style>
</head>

<body>
  <div class="desktop" id="desktop">
    <div class="wallpaper" id="wallpaper" data-wall="sonoma" aria-hidden="true"></div>
    <div class="desk-icons" id="desk-icons" role="listbox" aria-label="Desktop"></div>

    <div class="stage" id="stage">
      <!-- Portfolio -->
      <section class="window win--portfolio" id="win-portfolio" data-app="portfolio" data-title="Portfolio" aria-label="Portfolio">
        <div class="window__clip">
          <div class="split">
            <aside class="sidebar" aria-label="Sidebar">
              <div class="sidebar__top drag"></div>
              <label class="search-field">
                <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.9" cy="6.9" r="4.6"/><path d="m10.4 10.4 3.6 3.6" stroke-width="1.6"/></svg>
                <input type="search" id="pf-search" placeholder="Search" aria-label="Search portfolio" autocomplete="off" spellcheck="false" />
                <button class="search-field__clear" id="pf-search-clear" type="button" aria-label="Clear search" hidden>
                  <svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><path d="m1.5 1.5 5 5m0-5-5 5" stroke-width="1.6"/></svg>
                </button>
              </label>
              <nav class="sidebar__scroll" id="pf-nav"></nav>
              <div class="sidebar__footer">
                <button class="sb-user" type="button" data-view="about" title="About Michael">
                  <img src="assets/portfolio/headshot.jpeg" alt="" />
                  <span><b>Michael Brancazio</b><small>New York, NY</small></span>
                </button>
              </div>
            </aside>
            <div class="content">
              <header class="toolbar drag" id="pf-toolbar">
                <button class="tb-btn" type="button" data-action="toggle-sidebar" aria-label="Toggle sidebar" title="Hide or show the sidebar">
                  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.75" y="3.25" width="14.5" height="11.5" rx="2.25"/><path d="M6.5 3.5v11"/><path d="M3.6 6.2h1.3M3.6 8.2h1.3M3.6 10.2h1.3"/></svg>
                </button>
                <div class="tb-group">
                  <button class="tb-btn" type="button" id="pf-back" data-action="back" aria-label="Back" title="See the previous page" disabled>
                    <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" stroke-width="1.6"/></svg>
                  </button>
                  <button class="tb-btn" type="button" id="pf-fwd" data-action="forward" aria-label="Forward" title="See the next page" disabled>
                    <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="m7 3.5 5.5 5.5L7 14.5" stroke-width="1.6"/></svg>
                  </button>
                </div>
                <div class="toolbar__title"><h1 id="pf-title">About</h1><span class="s" id="pf-sub">Michael Brancazio</span></div>
                <div class="toolbar__spacer"></div>
                <button class="tb-btn tb-btn--label" type="button" data-action="open-resume" title="Open résumé in Preview">
                  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 2.25h5.75L13.5 5.5v9.25c0 .55-.45 1-1 1h-8c-.55 0-1-.45-1-1v-11.5c0-.55.45-1 1-1z"/><path d="M10 2.4V5.5c0 .3.2.5.5.5h2.9"/><path d="M6.25 9h5M6.25 11.5h5M6.25 6.5h2"/></svg>
                  <span>Résumé</span>
                </button>
                <button class="tb-btn" type="button" data-action="share" aria-label="Share" title="Share">
                  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 11V2.25M5.9 5.1 9 2l3.1 3.1"/><path d="M6.25 7.25H5a1.5 1.5 0 0 0-1.5 1.5v5.5A1.5 1.5 0 0 0 5 15.75h8a1.5 1.5 0 0 0 1.5-1.5v-5.5A1.5 1.5 0 0 0 13 7.25h-1.25"/></svg>
                </button>
              </header>
              <main class="pane" id="pf-pane">
                <div class="pane__inner" id="pf-view"></div>
              </main>
            </div>
            <div class="sidebar-scrim" data-action="toggle-sidebar"></div>
          </div>
        </div>
      </section>

      <!-- Employer detail -->
      <section class="window win--job is-closed" id="win-job" data-app="nyp" data-title="Role" aria-label="Employer details">
        <div class="window__clip">
          <header class="toolbar toolbar--leading drag">
            <div class="toolbar__title"><span class="t" id="job-title">Employer</span><span class="s" id="job-sub"></span></div>
            <div class="toolbar__spacer"></div>
            <button class="tb-btn tb-btn--label" type="button" data-action="job-in-portfolio" title="Show in Portfolio">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="5" width="14" height="10" rx="2"/><path d="M6.5 5V3.9c0-.5.4-.9.9-.9h3.2c.5 0 .9.4.9.9V5M2 9.5h14"/></svg>
              <span>All Experience</span>
            </button>
          </header>
          <div class="job-body selectable" id="job-body"></div>
        </div>
      </section>

      <!-- Messages -->
      <section class="window win--messages is-closed" id="win-messages" data-app="messages" data-title="Messages" aria-label="Messages">
        <div class="window__clip">
          <header class="toolbar toolbar--leading drag">
            <div class="msg-to"><img src="assets/portfolio/headshot.jpeg" alt="" /><span>To: <b>Michael Brancazio</b></span></div>
            <div class="toolbar__spacer"></div>
            <button class="tb-btn" type="button" data-vact="start" aria-label="Start voice chat" title="Voice chat with Michael’s AI">
              <svg class="ico ico--fill" viewBox="0 0 18 18" aria-hidden="true"><path d="M5.3 2.5h1.8l1.1 3-1.4 1.1a8 8 0 0 0 3.6 3.6l1.1-1.4 3 1.1v1.8c0 .9-.7 1.7-1.7 1.7A11.1 11.1 0 0 1 3.6 4.2c0-1 .8-1.7 1.7-1.7z"/></svg>
            </button>
            <button class="tb-btn" type="button" data-action="email" aria-label="Email Michael" title="Email Michael">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3.75" width="14" height="10.5" rx="2"/><path d="m2.6 5 6.4 4.9L15.4 5"/></svg>
            </button>
          </header>
          <div class="msg-thread js-thread" id="msg-thread" aria-live="polite"></div>
          <div class="msg-chips js-chips" id="msg-chips"></div>
          <form class="composer" id="msg-form">
            <div class="composer__field">
              <textarea id="msg-input" class="js-msg-input" rows="1" placeholder="iMessage" aria-label="Message"></textarea>
              <button type="button" class="mic-btn" data-vact="start" aria-label="Start voice chat" title="Talk to Michael’s AI">
                <svg class="ico" viewBox="0 0 18 18" aria-hidden="true" style="stroke-width:1.9"><path d="M2.5 7.5v3M5.5 5v8M8.5 2.5v13M11.5 5.5v7M14.5 7v4"/></svg>

      iosEl.addEventListener("pointerup", end);
      iosEl.addEventListener("pointercancel", end);
    }

    /* ─── Long-press on Home Screen icons ─── */
    var press = null, suppressClick = false;
    iosEl.addEventListener("pointerdown", function (e) {
      var btn = e.target.closest(".i-home .i-appicon[data-iapp]");
      if (!btn || !btn.dataset.iapp) return;
      press = { btn: btn, x: e.clientX, y: e.clientY, t: setTimeout(function () { suppressClick = true; openQuickMenu(btn); press = null; }, 480) };
    });
    iosEl.addEventListener("pointermove", function (e) { if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 10) { clearTimeout(press.t); press = null; } });
    ["pointerup", "pointercancel"].forEach(function (ev) { iosEl.addEventListener(ev, function () { if (press) { clearTimeout(press.t); press = null; } }); });
    iosEl.addEventListener("contextmenu", function (e) {
      var btn = e.target.closest(".i-appicon[data-iapp]");
      e.preventDefault();
      if (btn && btn.closest(".i-home") && !IOS.overlay) { suppressClick = false; openQuickMenu(btn); }
    });

    function launchIcon(btn) {
      var a = IAPPS[btn.dataset.iapp];
      if (!a) return;
      if (a.href) { if (/^https?:/.test(a.href)) window.open(a.href, "_blank", "noopener"); else location.href = a.href; return; }
      iosOpenApp(a.open[0], { tab: a.open[1], from: btn.querySelector(".i-ico") || btn });
    }

    /* ─── Actions ─── */
    function iosAction(a, el) {
      var arg = a.indexOf(":") > -1 ? a.slice(a.indexOf(":") + 1) : "";
      var name = arg ? a.slice(0, a.indexOf(":")) : a;
      switch (name) {
        case "close-app": return iosCloseApp();
        case "resume": return iosOpenApp("resume");
        case "message": return iosOpenApp("messages");
        case "contact-card": return iosOpenApp("portfolio", { tab: "contact" });
        case "share": return iosShare();
        case "print": closeOverlay(true); return printResume();
        case "vcard": closeOverlay(); return downloadVCard();
        case "copy-email": return copyText(CONTACT.email, "Email");
        case "copy-phone": return copyText(CONTACT.phone, "Number");
        case "copy-link": closeOverlay(); return copyText(shareURL(), "Link");
        case "email": location.href = "mailto:" + CONTACT.email; return;
        case "call": location.href = "tel:" + CONTACT.phoneRaw; return;
        case "linkedin": window.open(CONTACT.linkedin, "_blank", "noopener"); return;
        case "dismiss": return closeOverlay();
        case "dismiss-later": setTimeout(closeOverlay, 200); return;
        case "home-search": iosOpenApp("portfolio", { tab: "search", from: el }); return;
        case "search-close": $("#i-search-input").blur(); return iosTab(IOS.prevTab || "about", { keep: true });
        case "search-q": $("#i-search-input").value = arg; return renderIOSSearch(arg);
        case "toggle-chips": $("#i-chips").hidden = !$("#i-chips").hidden; return;
        case "clear-chat": resetChat(); hud("Conversation Cleared"); return;
        case "theme":
          if (arg) setTheme(arg, true); else { try { localStorage.removeItem("mb.theme"); } catch (_) {} setTheme(systemDark() ? "dark" : "light"); }
          return renderSettings();
        case "wall": setWall(arg); return renderSettings();
        case "desktop-site": return setForceDesktop(true);
      }
    }
    iosEl.addEventListener("click", function (e) {
      if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
      var t = e.target, el;
      if ((el = t.closest("[data-iquick]"))) { var q = IOS.overlay && IOS.overlay.quick; closeOverlay(); if (q) q[+el.dataset.iquick][2](); return; }
      if ((el = t.closest("[data-iact]"))) { if (el.tagName !== "A") e.preventDefault(); iosAction(el.dataset.iact, el); return; }
      if ((el = t.closest("[data-ifolder]"))) { openFolder(); return; }
      if ((el = t.closest("[data-ijob]"))) { var from = el.querySelector(".i-ico"); closeOverlay(true); iosShowJob(el.dataset.ijob, { from: from }); return; }
      if ((el = t.closest("[data-iapp-go]"))) { iosOpenApp(el.dataset.iappGo); return; }
      if ((el = t.closest("[data-iapp]"))) { launchIcon(el); return; }
      if ((el = t.closest("[data-itab]"))) { var tb = $("#i-tabbar"); if (tb.classList.contains("is-min")) { tb.classList.remove("is-min"); requestAnimationFrame(placeLens); if (el.classList.contains("is-on")) return; } iosTab(el.dataset.itab); return; }
      if ((el = t.closest("[data-iback]"))) { popPage(); return; }
      if ((el = t.closest("[data-ipush]"))) {
        var k = el.dataset.ipush.split(":");
        pushPage(k[0] === "job" ? iEmployer(k[1]) : iProject(k[1]));
        return;
      }
      if ((el = t.closest("[data-ishow-job], [data-show-job]"))) { iosShowJob(el.dataset.ishowJob || el.dataset.showJob); return; }
      if ((el = t.closest("[data-ihit]"))) { $("#i-search-input").blur(); iosGo(INDEX[+el.dataset.ihit].go); return; }
      if ((el = t.closest(".msg-chip"))) { sendChat(el.dataset.msg, "suggestion"); return; }
    });

    /* Scroll: large-title collapse + tab bar minimise (iOS 26) */
    var lastY = new WeakMap();
    iosEl.addEventListener("scroll", function (e) {
      var sc = e.target;
      if (!sc.classList || !sc.classList.contains("i-scroll")) return;
      var pw = sc.parentElement, y = sc.scrollTop, prev = lastY.get(sc) || 0;
      pw.classList.toggle("is-scrolled", y > 34);
      if (sc.closest("#i-app-portfolio") && IOS.tab !== "search") {
        var tb = $("#i-tabbar");
        if (y - prev > 10 && y > 120) tb.classList.add("is-min");
        else if (prev - y > 10 || y < 40) { if (tb.classList.contains("is-min")) { tb.classList.remove("is-min"); requestAnimationFrame(placeLens); } }
      }
      lastY.set(sc, y);
    }, true);

    /* Composer & search input */
    $("#i-msg-form").addEventListener("submit", function (e) { e.preventDefault(); sendChat($("#i-msg-input").value); });
    $("#i-msg-input").addEventListener("input", function () {
      var i = $("#i-msg-input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 120) + "px";
      $("#i-send").disabled = !i.value.trim();
    });
    $("#i-msg-input").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !realPhone && !e.isComposing) { e.preventDefault(); sendChat(e.target.value); } });
    $("#i-search-input").addEventListener("input", function (e) { renderIOSSearch(e.target.value); });
    $("#i-search-input").addEventListener("keydown", function (e) { if (e.key === "Enter") e.target.blur(); });

    function iosKey(e) {
      if (e.key === "Escape") {
        if (IOS.overlay) closeOverlay();
        else if (IOS.app === "portfolio" && IOS.tab === "search") iosAction("search-close");
        else if (IOS.app === "portfolio" && popPage()) {}
        else if (IOS.app) iosCloseApp();
        return true;
      }
      var mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "k") { iosOpenApp("portfolio", { tab: "search" }); return true; }
      if (mod && e.key.toLowerCase() === "p") { printResume(); return true; }
      return false;
    }

    /* ─── Switching between Mac and iPhone, keeping your place ─── */
    function setForceDesktop(v) {
      forceDesktop = v;
      try { if (v) sessionStorage.setItem("mb.forceDesktop", "1"); else sessionStorage.removeItem("mb.forceDesktop"); } catch (_) {}
      applyMode();
    }
    function enterIOS(o) {
      o = o || {};
      var macApp = focused && st(focused).open && !st(focused).minimized ? focused.dataset.app : null;
      var view = pf.view;
      closeMenu(true); closeSpotlight();
      IOS.on = true;
      document.body.classList.add("is-ios");
      iosEl.removeAttribute("aria-hidden");
      if (o.boot) {
        var h = o.hash || "";
        if (h === "messages") iosOpenApp("messages", { instant: true });
        else if (h === "resume") iosOpenApp("resume", { instant: true });
        else if (h.indexOf("job=") === 0 && JOBS[h.slice(4)]) iosShowJob(h.slice(4), { instant: true });
        else if (h && h !== "about" && VIEWS[h]) iosOpenApp("portfolio", { tab: viewToTab(h), instant: true });
        return;
      }
      if (macApp === "portfolio") {
        if (view === "search") { $("#i-search-input").value = pf.q; iosOpenApp("portfolio", { tab: "search", instant: true }); }
        else iosOpenApp("portfolio", { tab: viewToTab(view), instant: true });
      } else if (macApp === "messages") iosOpenApp("messages", { instant: true });
      else if (macApp === "preview") iosOpenApp("resume", { instant: true });
      else if (macApp && JOBS[macApp]) iosShowJob(macApp, { instant: true });
      else if (IOS.app) iosCloseApp({ instant: true });
    }
    var macPlaced = false;
    function exitIOS() {
      var app = IOS.app, tab = IOS.tab, tv = app === "portfolio" ? tabview(tab) : null;
      var topKey = tv && tv.lastElementChild ? tv.lastElementChild.dataset.key : "";
      closeOverlay(true);
      IOS.on = false;
      document.body.classList.remove("is-ios");
      iosEl.setAttribute("aria-hidden", "true");
      if (app) iosCloseApp({ instant: true });
      applyCompact();
      if (!macPlaced) { placeCentered(W["win-portfolio"], -30, -6); macPlaced = true; }
      if (app === "portfolio") {
        if (topKey.indexOf("job:") === 0) showJob(topKey.slice(4));
        else if (topKey.indexOf("project:") === 0) goView("projects", "proj-" + topKey.slice(8));
        else if (tab === "search" && $("#i-search-input").value.trim()) { $("#pf-search").value = $("#i-search-input").value; onSearchInput(); showPortfolio(); }
        else goView(tabToView(tab));
      } else if (app === "messages") openMessages();
      else if (app === "resume") openResume();
      else renderView();
    }
    function applyMode() {
      var on = wantIOS();
      if (on === IOS.on) return;
      if (on) enterIOS(); else exitIOS();
    }
    iosMQ.addEventListener ? iosMQ.addEventListener("change", applyMode) : iosMQ.addListener(applyMode);
    if (window.visualViewport) {
      var vv = function () { if (IOS.on && realPhone) iosEl.style.setProperty("--vvh", window.visualViewport.height + "px"); };
      window.visualViewport.addEventListener("resize", vv);
    }
    window.addEventListener("resize", function () { if (IOS.on) { placeLens(); if (IOS.app === "resume") fitDoc(); } });

    function initIOS() {
      renderIOSHome();
      renderTabbar();
      $("#i-search-ico").innerHTML = SEARCH_SVG;
      $("#i-search-close").innerHTML = icon("x");
      $("#i-msg-back").innerHTML = BACK_CHEV;
      $("#i-msg-chev").innerHTML = icon("chevron");
      $("#i-msg-call").innerHTML = V_ICON.call;
      $("#i-mic").innerHTML = V_ICON.wave;
      $("#i-plus").innerHTML = '<svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" stroke-width="2"/></svg>';
      $("#i-send").innerHTML = '<svg class="ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 11.5V2.8M3.2 6.4 7 2.6l3.8 3.8"/></svg>';
      $("#i-doc-close").innerHTML = icon("x");
      $("#i-doc-share").innerHTML = SHARE_SVG;
      $("#i-doc-print").innerHTML = icon("download") + "Save PDF";
      $("#i-doc-vcard").innerHTML = icon("person") + "Contact";
      $("#i-docpage").innerHTML = renderResume();
      ["about", "experience", "projects", "skills", "contact", "search"].forEach(function (t) { tabview(t).innerHTML = tabRoot(t); });
      setupHomeGesture();
      setupEdgeSwipe();
      if (!wantIOS()) iosEl.setAttribute("aria-hidden", "true");
    }

    /* ─────────────── Boot ─────────────── */
    setTheme(store.get("theme", systemDark() ? "dark" : "light"));
    setWall(store.get("wall", systemDark() ? "sequoia" : "sonoma"));
    renderDock();
    renderDesktop();
    renderNav();
    buildIndex();
    resetChat();
    $("#pv-page").innerHTML = renderResume();
    $("#about-dl").innerHTML = [["Location", CONTACT.location], ["Experience", yearsInData() + "+ years in data"], ["Current", "NewYork–Presbyterian · IQVIA"], ["Education", "MHA, Hofstra University"], ["Contact", CONTACT.email]]
      .map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("");
    WINS.forEach(function (w) { traffic(w); setupDrag(w); setupResize(w); st(w); });
    applyCompact();
    tick();
    setInterval(tick, 10000);
    initMagnification();

    var hash = (location.hash || "").slice(1);
    if (hash && hash.indexOf("job=") === 0 && JOBS[hash.slice(4)]) { pf.view = "experience"; pf.hist = ["experience"]; }
    else if (VIEWS[hash] && hash !== "search") { pf.view = hash; pf.hist = [hash]; }
    renderView();
    initIOS();
    $("#win-messages .window__clip").insertAdjacentHTML("beforeend", voiceOverlayHTML(false));
    $("#i-app-messages").insertAdjacentHTML("beforeend", voiceOverlayHTML(true));
    if (wantIOS()) enterIOS({ boot: true, hash: hash });
    requestAnimationFrame(function () {
      if (!IOS.on) { placeCentered(W["win-portfolio"], -30, -6); macPlaced = true; }
      focusWindow(W["win-portfolio"]);
      updateDock();
      if (IOS.on) {}
      else if (hash === "resume") openResume();
      else if (hash === "messages") openMessages();
      else if (hash.indexOf("job=") === 0 && JOBS[hash.slice(4)]) openJob(hash.slice(4));
      if (!reduceMotion && !IOS.on) W["win-portfolio"].animate([{ transform: "scale(0.96) translateY(8px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
      setTimeout(function () { if (IOS.on) { if (!IOS.app) iosNotify(); } else notify(); }, 1800);
    });
  })();
  </script>
</body>
</html>
