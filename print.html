<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal-Style Typing Animation</title>
  <style>
    body.standalone { background-color: #0b100d; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .terminal-content.static-mode { height: auto; max-height: 90vh; overflow-y: auto; justify-content: flex-start; }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } .line { transition: none; } }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    
    .terminal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .terminal-content {
      position: relative;
      width: 80%;
      max-width: 600px;
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
    }
    
    .line {
      flex: 0 0 auto;
      overflow-wrap: anywhere;
      font-family: monospace;
      color: #4ade80; /* green-400 */
      width: 100%;
      text-align: center;
      margin: 5px 0;
      line-height: 1.5;
      transform: translateY(0);
      transition: transform 0.5s ease-out;
    }
    
    .command {
      font-size: clamp(20px, 4vw, 28px);
    }
    
    .output {
      font-size: clamp(16px, 3.5vw, 22px);
    }
    
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      background-color: #4ade80;
      animation: blink 0.5s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <noscript>Portfolio: Data Science, Dashboards, UI, LLMs, Python, Machine Learning, AI, Engineering, Business Intelligence, Tableau, D3.js, SQL, HTML &amp; CSS, JS, Cloud Computing, AI Strategy.</noscript>
  <div class="terminal">
    <div class="terminal-content" id="terminal-content" aria-hidden="true">
      <!-- Lines will be added here -->
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const terminalContent = document.getElementById('terminal-content');
      const fullText = "print(portfolio)";
      
      const portfolioItems = [
        "Data Science",
        "Dashboards",
        "UI",
        "LLMs",
        "Python",
        "Machine Learning",
        "AI",
        "Engineering",
        "Business Intelligence",
        "Tableau",
        "D3.js",
        "SQL",
        "HTML & CSS",
        "JS",
        "Cloud Computing",
        "AI Strategy"
      ];
      
      const accessibleSummary = document.createElement('p');
      accessibleSummary.className = 'sr-only';
      accessibleSummary.textContent = `Portfolio: ${portfolioItems.join(', ')}.`;
      document.body.appendChild(accessibleSummary);

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parentOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
      let started = false;
      let finished = false;
      let timerId = null;
      let pendingAction = null;
      let remainingDelay = 0;
      let timerStarted = 0;

      function pauseTimer() {
        if (timerId === null) return;
        clearTimeout(timerId);
        timerId = null;
        remainingDelay = Math.max(0, remainingDelay - (performance.now() - timerStarted));
      }

      function resumeTimer() {
        if (document.hidden || !pendingAction || timerId !== null) return;
        timerStarted = performance.now();
        timerId = setTimeout(() => {
          timerId = null;
          const action = pendingAction;
          pendingAction = null;
          action();
        }, remainingDelay);
      }

      function schedule(action, delay) {
        pauseTimer();
        pendingAction = action;
        remainingDelay = delay;
        resumeTimer();
      }

      function finish() {
        if (finished) return;
        finished = true;
        if (window.parent !== window) window.parent.postMessage('animationFinished', parentOrigin);
      }

      function showStaticPortfolio() {
        pauseTimer();
        pendingAction = null;
        terminalContent.replaceChildren();
        terminalContent.classList.add('static-mode');
        [fullText, ...portfolioItems].forEach((text, index) => {
          const line = document.createElement('div');
          line.className = `line ${index === 0 ? 'command' : 'output'}`;
          line.textContent = text;
          terminalContent.appendChild(line);
        });
        finish();
      }

      function typeLine(text, className, onComplete) {
        const line = document.createElement('div');
        line.className = `line ${className}`;
        const textNode = document.createTextNode('');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        line.append(textNode, cursor);
        terminalContent.appendChild(line);
        let index = 0;
        const typeNext = () => {
          textNode.textContent = text.slice(0, ++index);
          if (index < text.length) {
            schedule(typeNext, className === 'command' ? 100 : 65);
          } else {
            cursor.remove();
            schedule(onComplete, 450);
          }
        };
        typeNext();
      }

      function addPortfolioItem(index) {
        if (index >= portfolioItems.length) { finish(); return; }
        typeLine(portfolioItems[index], 'output', () => addPortfolioItem(index + 1));
      }

      function startAnimation() {
        // Repeated parent messages must not create competing typing timers.
        if (started) return;
        started = true;
        if (reducedMotion.matches) { showStaticPortfolio(); return; }
        schedule(() => typeLine(fullText, 'command', () => addPortfolioItem(0)), 300);
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent || event.origin !== window.location.origin) return;
        if (event.data === 'startAnimation') startAnimation();
      });
      document.addEventListener('visibilitychange', () => document.hidden ? pauseTimer() : resumeTimer());
      window.addEventListener('pagehide', pauseTimer);
      window.addEventListener('pageshow', resumeTimer);
      reducedMotion.addEventListener('change', event => {
        if (event.matches && started) showStaticPortfolio();
      });
      if (window.parent === window) { document.body.classList.add('standalone'); startAnimation(); }

    });
  </script>
</body>
</html>
